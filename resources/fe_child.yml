resources:
  jobs:
    fe_child:
      name: fe_child
      tasks:
        - task_key: Raw
          notebook_task:
            notebook_path: src/NB_raw_bundle
            source: GIT
        - task_key: Silver
          depends_on:
            - task_key: Raw
          notebook_task:
            notebook_path: src/NB_silver_bundle
            source: GIT
      git_source:
        git_url: https://github.com/SerenityK64/databricks_testing.git
        git_provider: gitHub
        git_branch: feature/bharathwaj
      queue:
        enabled: true
      parameters:
        - name: i
          default: "3"
        - name: j
          default: "2"
      performance_target: PERFORMANCE_OPTIMIZED
