# This is a Databricks asset bundle definition for debuging_jobs.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: debuging_jobs
  uuid: 80e66f80-c227-479a-a2cd-6497cc2895ab

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-68909e8a-2b6b.cloud.databricks.com
    variables:
      catalog: mono_testing
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-68909e8a-2b6b.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/michael.thomas@kanini.com to make sure we only have a single copy.
      root_path: /Workspace/Users/michael.thomas@kanini.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mono_testing
      schema: prod
    permissions:
      - user_name: michael.thomas@kanini.com
        level: CAN_MANAGE
